services:
  app_api6:
    image: ${APP_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE:-America/Fortaleza}
      LOCK_DSN: ${LOCK_DSN:-flock}
      APP_IMAGE: ${APP_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/api6.grwxtech.com/app:latest}
      NGINX_IMAGE: ${NGINX_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/api6.grwxtech.com/nginx:latest}
    restart: unless-stopped
    volumes:
      - symfony_app_var:/var/www/var
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - symfony_app
      - dokploy-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
  nginx_api6:
    image: ${NGINX_IMAGE}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - symfony_app
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/html", "http://localhost/api/doc"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app_api6
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  symfony_app_var:

networks:
  symfony_app:
  dokploy-network:
    external: true
