services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile.prod
      target: production
    environment:
      APP_ENV: prod
      APP_DEBUG: false
    restart: unless-stopped
    volumes:
      - ./.env.local:/var/www/.env.local:ro
      - symfony_app_var:/var/www/var
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - symfony_app
      - dokploy-network

  nginx:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile.prod
      target: nginx
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - symfony_app
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/html", "http://localhost/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app

volumes:
  symfony_app_var:

networks:
  symfony_app:
  dokploy-network:
    external: true
